<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Builder Chat | KERAM</title>

<link rel="stylesheet" href="style.css?v=rooms-1">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>

<nav class="nav">
    <a class="brand" href="index.html">KERAM</a>

    <div class="nav-links">
        <a href="index.html">← Back to Home</a>
    </div>
</nav>

<section class="section chat-page">

<div class="glass chat-shell">

<h1>Builder Chat</h1>

<p class="builder-subtitle">
Talk. Laugh. Meet other builders.
</p>

<div class="chat-room-panel">

    <div class="chat-room-heading">
        <span>Current room:</span>
        <strong id="room-name">Builder Chat</strong>
    </div>

    <div class="chat-room-actions">
        <button
        id="public-room-button"
        class="chat-room-button is-active"
        type="button">
        Public Chat
        </button>

        <button
        id="create-room-button"
        class="chat-room-button"
        type="button">
        Create Private Room
        </button>

        <button
        id="join-room-button"
        class="chat-room-button"
        type="button">
        Join Private Room
        </button>
    </div>

    <p
    id="room-status"
    class="chat-room-status"
    role="status"
    aria-live="polite">
    Public Builder Chat
    </p>

</div>

<label for="language">

<label for="language">
My language:
</label>

<select id="language">
    <option value="hr">Hrvatski</option>
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="it">Italiano</option>
</select>

<div id="chat-window" class="chat-window">
    <div class="chat-message">
        <strong>System</strong><br>
        Loading Builder Chat...
    </div>
</div>

<form id="chat-form" class="chat-form">

<input
id="username"
type="text"
placeholder="Your name"
required>

<input
id="message"
type="text"
placeholder="Write a message..."
autocomplete="off"
required>

<button
id="send-button"
class="btn btn-gold"
type="submit">
Send
</button>

</form>

<p
id="chat-status"
class="chat-status"
role="status"
aria-live="polite">
</p>

</div>

</section>

<script>

const form =
    document.getElementById("chat-form");

const windowBox =
    document.getElementById("chat-window");

const usernameInput =
    document.getElementById("username");

const messageInput =
    document.getElementById("message");

const languageSelect =
    document.getElementById("language");

const sendButton =
    document.getElementById("send-button");

    const chatStatus =
    document.getElementById("chat-status");

    const API_URL =
    "https://kgcl-api.hqkeram.workers.dev";
    const AUTHOR_KEY_STORAGE_KEY =
    "kgclAuthorKey";

    const ACTIVE_ROOM_CODE_KEY =
    "kgclActiveRoomCode";

const ACTIVE_ROOM_NAME_KEY =
    "kgclActiveRoomName";

const roomNameElement =
    document.getElementById("room-name");

const roomStatus =
    document.getElementById("room-status");

const publicRoomButton =
    document.getElementById("public-room-button");

const createRoomButton =
    document.getElementById("create-room-button");

const joinRoomButton =
    document.getElementById("join-room-button");

let activeRoomCode =
    localStorage.getItem(ACTIVE_ROOM_CODE_KEY) || "";

let activeRoomName =
    localStorage.getItem(ACTIVE_ROOM_NAME_KEY) ||
    "Builder Chat";

function roomHeaders(includeContentType = false) {
    const headers = {};

    if (includeContentType) {
        headers["Content-Type"] =
            "application/json";
    }

    if (activeRoomCode) {
        headers["X-Room-Code"] =
            activeRoomCode;
    }

    return headers;
}

const ACCOUNT_STORAGE_KEY = "keramAccountSession";

async function restoreAccountIdentity() {
    let session = null;

    try {
        session = JSON.parse(
            localStorage.getItem(ACCOUNT_STORAGE_KEY) || "null"
        );
    } catch (error) {
        return;
    }

    if (!session || !session.token) {
        return;
    }

    try {
        const response = await fetch(
            `${API_URL}/api/accounts/me`,
            {
                headers: {
                    Authorization: `Bearer ${session.token}`
                }
            }
        );

        if (!response.ok) {
            return;
        }

        const data = await response.json();
        const account = data.account;

        usernameInput.value = `@${account.username}`;
        usernameInput.dataset.accountUsername = account.username;
        usernameInput.readOnly = true;
        usernameInput.autocomplete = "off";
        usernameInput.setAttribute(
            "aria-label",
            `Signed in as @${account.username}`
        );

        if (
            Array.from(languageSelect.options).some(
                (option) => option.value === account.preferredLanguage
            )
        ) {
            languageSelect.value = account.preferredLanguage;
        }
    } catch (error) {
        console.info("KERAM account identity unavailable.");
    }
}

function getAuthorKey() {
    let authorKey =
        localStorage.getItem(AUTHOR_KEY_STORAGE_KEY);

    if (!authorKey) {
        const randomBytes =
            new Uint8Array(32);

        crypto.getRandomValues(randomBytes);

        authorKey = Array.from(randomBytes)
            .map((byte) =>
                byte.toString(16).padStart(2, "0")
            )
            .join("");

        localStorage.setItem(
            AUTHOR_KEY_STORAGE_KEY,
            authorKey
        );
    }

    return authorKey;
}

async function hashAuthorKey(value) {
    const data =
        new TextEncoder().encode(value);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    return Array.from(
        new Uint8Array(hash)
    )
        .map((byte) =>
            byte.toString(16).padStart(2, "0")
        )
        .join("");
}

const authorKey = getAuthorKey();
const authorKeyHashPromise =
    hashAuthorKey(authorKey);

let loadingMessages = false;
let sendingMessage = false;
let messageSendFailed = false;
let initialMessagesLoaded = false;

async function loadMessages() {

    if (loadingMessages) {
        return;
    }

    loadingMessages = true;

    try {

        const currentAuthorKeyHash =
            await authorKeyHashPromise;

        const language =
            languageSelect.value;

        const response = await fetch(
    `${API_URL}/api/messages?language=${language}`,
    {
        headers: roomHeaders()
    }
);

const data = await response.json();

if (!response.ok) {
    throw new Error(
        data.error || "Room could not be loaded."
    );
}

const currentRoom = data.room || {
    id: null,
    name: "Builder Chat",
    private: false
};

roomNameElement.textContent =
    currentRoom.name;

roomStatus.textContent =
    currentRoom.private
        ? `Private room — code: ${activeRoomCode}`
        : "Public Builder Chat";

publicRoomButton.classList.toggle(
    "is-active",
    !currentRoom.private
);

if (currentRoom.private) {
    activeRoomName = currentRoom.name;

    localStorage.setItem(
        ACTIVE_ROOM_NAME_KEY,
        activeRoomName
    );
}

        const latestMessageId = data.messages.reduce(
            (latestId, message) =>
                Math.max(
                    latestId,
                    Number(message.id) || 0
                ),
            0
        );

        if (latestMessageId > 0) {
            localStorage.setItem(
                "kgclLastReadMessageId",
                String(latestMessageId)
            );
        }

        windowBox.innerHTML = "";

        if (data.messages.length === 0) {

            const emptyMessage =
                document.createElement("div");

            emptyMessage.className =
                "chat-message";

            emptyMessage.textContent =
                "No messages yet.";

            windowBox.appendChild(
                emptyMessage
            );

            return;

        }

        for (const message of data.messages) {

            const messageElement =
                document.createElement("div");

            messageElement.className =
                "chat-message";

                        const metaElement =
                document.createElement("div");

            metaElement.className =
                "chat-message-meta";

            const usernameElement =
                document.createElement("span");

            usernameElement.className =
                "chat-message-username";

            usernameElement.textContent =
                message.username;

            const languageElement =
                document.createElement("span");

            languageElement.className =
                "chat-message-language";

            const messageDate =
                new Date(message.createdAt);

            const formattedTime =
                Number.isNaN(messageDate.getTime())
                    ? ""
                    : new Intl.DateTimeFormat(
                        language === "hr"
                            ? "hr-HR"
                            : "en-GB",
                        {
                            dateStyle: "short",
                            timeStyle: "short"
                        }
                    ).format(messageDate);

            languageElement.textContent =
                formattedTime
                    ? `${message.language.toUpperCase()} · ${formattedTime}`
                    : message.language.toUpperCase();

            const displayedText =
                message.language === language
                    ? message.text
                    : message.translations[
                        language
                    ] || message.text;
                    const isOwnMessage =
                    message.authorKeyHash ===
                    currentAuthorKeyHash;

            metaElement.appendChild(
                usernameElement
            );

            metaElement.appendChild(
                languageElement
            );

            messageElement.appendChild(
                metaElement
            );

            messageElement.appendChild(
                document.createTextNode(
                    displayedText
                )
            );

            if (isOwnMessage) {
    const editButton =
        document.createElement("button");

    editButton.type = "button";
    editButton.className =
        "chat-message-edit";

    editButton.textContent = "Edit";

    editButton.addEventListener(
    "click",
    async () => {
        const editedText = window.prompt(
            "Edit your message:",
            message.text
        );

        if (editedText === null) {
            return;
        }

        const newText = editedText.trim();

        if (
            !newText ||
            newText === message.text
        ) {
            return;
        }

        editButton.disabled = true;
        chatStatus.textContent =
            "Updating message...";

        try {
            const response = await fetch(
                `${API_URL}/api/messages/${message.id}`,
                {
                    method: "PATCH",
                    headers: roomHeaders(true),
                    body: JSON.stringify({
                        text: newText,
                        authorKey
                    })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Message could not be updated."
                );
            }

            await loadMessages();

            chatStatus.textContent =
                "Message updated.";

        } catch (error) {
            chatStatus.textContent =
                "Message could not be updated.";

            editButton.disabled = false;
        }
    }
);

    messageElement.appendChild(
        editButton
    );
}

            windowBox.appendChild(
                messageElement
            );

        }

       if (!initialMessagesLoaded) {
    windowBox.scrollTop =
        windowBox.scrollHeight;

    initialMessagesLoaded = true;
}
    } catch (error) {

    windowBox.innerHTML = `
        <div class="chat-message">
            <strong>KGCL Public Preview</strong><br>
            Two builders. Two languages. One conversation.
        </div>

        <div class="chat-message">
            <strong>HR · Luka</strong><br>
            Gradimo mjesto gdje jezik ne dijeli ljude.
        </div>

        <div class="chat-message">
            <strong>EN · KGCL</strong><br>
            We are building a place where language does not divide people.
        </div>

        <div class="chat-message">
            <strong>Coming online soon</strong><br>
            The working local AI prototype already translates Croatian and English.
        </div>
    `;

                    if (!sendingMessage && !messageSendFailed) {
            chatStatus.textContent =
                "Messages could not be refreshed. Check your connection.";
        }

    } finally {

        loadingMessages = false;

    }

}

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        if (sendingMessage) {
            return;
        }

        const username =
            usernameInput.dataset.accountUsername ||
            usernameInput.value.trim();

        const message =
            messageInput.value.trim();

        const language =
            languageSelect.value;

        if (!username || !message) {
            return;
        }

        sendingMessage = true;
        sendButton.disabled = true;
        messageSendFailed = false;

        chatStatus.textContent =
            "Sending message...";

        try {

            const response = await fetch(`${API_URL}/api/messages`, {
                method: "POST",
                headers: roomHeaders(true),
                body: JSON.stringify({
                text: message,
                language,
                username,
                authorKey
            })
            });

            if (!response.ok) {
                throw new Error(
                    "Message was not accepted."
                );
            }

                messageInput.value = "";

    try {
        await loadMessages();
    } catch (error) {
        console.error(
            "Message refresh failed:",
            error
        );
    }

    chatStatus.textContent =
        "Message sent.";

        } catch (error) {

            messageSendFailed = true;

            console.error(
                "Message sending failed:",
                error
            );

            chatStatus.textContent =
                "Message could not be sent. Please try again.";

        } finally {

            sendingMessage = false;
            sendButton.disabled = false;
            messageInput.focus();

        }

    }
);

publicRoomButton.addEventListener(
    "click",
    async () => {
        activeRoomCode = "";
        activeRoomName = "Builder Chat";

        localStorage.removeItem(
            ACTIVE_ROOM_CODE_KEY
        );

        localStorage.removeItem(
            ACTIVE_ROOM_NAME_KEY
        );

        roomNameElement.textContent =
            "Builder Chat";

        roomStatus.textContent =
            "Public Builder Chat";

        publicRoomButton.classList.add(
            "is-active"
        );

        await loadMessages();
    }
);

createRoomButton.addEventListener(
    "click",
    async () => {
        const enteredName = prompt(
            "Private room name:"
        );

        if (enteredName === null) {
            return;
        }

        const roomName =
            enteredName.trim();

        if (!roomName) {
            roomStatus.textContent =
                "Enter a room name.";
            return;
        }

        roomStatus.textContent =
            "Creating private room…";

        try {
            const response = await fetch(
                `${API_URL}/api/rooms`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        name: roomName,
                        authorKey
                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Private room could not be created."
                );
            }

            activeRoomCode =
                data.room.code;

            activeRoomName =
                data.room.name;

            localStorage.setItem(
                ACTIVE_ROOM_CODE_KEY,
                activeRoomCode
            );

            localStorage.setItem(
                ACTIVE_ROOM_NAME_KEY,
                activeRoomName
            );

            publicRoomButton.classList.remove(
                "is-active"
            );

            await loadMessages();

            roomStatus.textContent =
                `Invite code: ${activeRoomCode}`;

            alert(
                `Private room created.\n\nInvite code: ${activeRoomCode}`
            );

        } catch (error) {
            roomStatus.textContent =
                error.message;
        }
    }
);

joinRoomButton.addEventListener(
    "click",
    async () => {
        const enteredCode = prompt(
            "Enter private room code:"
        );

        if (enteredCode === null) {
            return;
        }

        const roomCode =
            enteredCode.trim().toUpperCase();

        if (!roomCode) {
            roomStatus.textContent =
                "Enter a valid room code.";
            return;
        }

        roomStatus.textContent =
            "Joining private room…";

        try {
            const response = await fetch(
                `${API_URL}/api/rooms/join`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        code: roomCode
                    })
                }
            );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Private room could not be joined."
                );
            }

            activeRoomCode = roomCode;
            activeRoomName =
                data.room.name;

            localStorage.setItem(
                ACTIVE_ROOM_CODE_KEY,
                activeRoomCode
            );

            localStorage.setItem(
                ACTIVE_ROOM_NAME_KEY,
                activeRoomName
            );

            publicRoomButton.classList.remove(
                "is-active"
            );

            await loadMessages();

        } catch (error) {
            roomStatus.textContent =
                error.message;
        }
    }
);

languageSelect.addEventListener(
    "change",
    loadMessages
);

restoreAccountIdentity();

loadMessages();

setInterval(
    loadMessages,
    1000
);

</script>

</body>
</html>
