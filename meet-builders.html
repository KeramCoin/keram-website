<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Builders | KERAM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>

<nav class="nav">
    <a class="brand" href="index.html#home">KERAM</a>

    <div class="nav-links">
        <a href="index.html">← Back to Home</a>
    </div>
</nav>

<section class="section">

    <div class="glass builder-page">

        <h1>Meet Builders</h1>

        <p class="builder-subtitle">
            Introduce yourself to the KERAM community.
        </p>

        <p class="builder-intro">
            Tell people who you are, what you build, where you're from and what you're passionate about.
            Every builder has a story.
        </p>

        <form class="builder-form">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input id="name" type="text" placeholder="John Smith">
            </div>

            <div class="form-group">
                <label for="profession">What do you build?</label>
                <input id="profession" type="text" placeholder="Tiler, Carpenter, Electrician, Artist...">
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input id="country" type="text" placeholder="Croatia">
            </div>

            <div class="form-group">
                <label for="about">About You</label>
                <textarea id="about" rows="8" placeholder="Introduce yourself to the KERAM community..."></textarea>
            </div>

            <button class="btn btn-gold" type="submit">
                Publish Profile
            </button>

        </form>

    </div>

</section>

</body>
</html>
