<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Others | KERAM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>

<nav class="nav">
    <a class="brand" href="index.html#home">KERAM</a>

    <div class="nav-links">
        <a href="index.html">← Back to Home</a>
    </div>
</nav>

<section class="section">

    <div class="glass builder-page">

        <h1>Help Others</h1>

        <p class="builder-subtitle">
            Offer your knowledge. Help another builder.
        </p>

        <p class="builder-intro">
            Share your experience, answer questions, offer advice or simply
            let the community know how you can help.
        </p>

        <form class="builder-form">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input id="name" type="text" placeholder="John Smith">
            </div>

            <div class="form-group">
                <label for="skill">How can you help?</label>
                <input id="skill" type="text" placeholder="Advice, Experience, Tools, Materials...">
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input id="country" type="text" placeholder="Croatia">
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" rows="8" placeholder="Tell the community how you can help..."></textarea>
            </div>

            <button class="btn btn-gold" type="submit">
                Offer Help
            </button>

        </form>

    </div>

</section>

</body>
</html>
