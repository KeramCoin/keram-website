<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Ideas | KERAM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>

<nav class="nav">
    <a class="brand" href="index.html#home">KERAM</a>

    <div class="nav-links">
        <a href="index.html">← Back to Home</a>
    </div>
</nav>

<section class="section">

    <div class="glass builder-page">

        <h1>Share Ideas</h1>

        <p class="builder-subtitle">
            Every great project begins with one idea.
        </p>

        <p class="builder-intro">
            Share your ideas, suggestions or concepts with the KERAM community.
            Inspiration often starts with a single conversation.
        </p>

        <form class="builder-form">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input id="name" type="text" placeholder="John Smith">
            </div>

            <div class="form-group">
                <label for="title">Idea Title</label>
                <input id="title" type="text" placeholder="Give your idea a short title">
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input id="category" type="text" placeholder="Community, Technology, Business...">
            </div>

            <div class="form-group">
                <label for="idea">Describe Your Idea</label>
                <textarea id="idea" rows="8" placeholder="Share your idea with the KERAM community..."></textarea>
            </div>

            <button class="btn btn-gold" type="submit">
                Share Idea
            </button>

        </form>

    </div>

</section>

</body>
</html>
