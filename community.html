<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community | KERAM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>

<nav class="nav">
    <a class="brand" href="index.html#home">KERAM</a>

    <div class="nav-links">
        <a href="index.html">← Back to Home</a>
    </div>
</nav>

<section class="section">

    <div class="glass builder-page">

        <h1>Community</h1>

        <p class="builder-subtitle">
            Connect. Organize. Build together.
        </p>

        <p class="builder-intro">
            Share community events, humanitarian actions, local meetups,
            collaborations or anything that brings builders together.
        </p>

        <form class="builder-form">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input id="name" type="text" placeholder="John Smith">
            </div>

            <div class="form-group">
                <label for="event">Event or Project</label>
                <input id="event" type="text" placeholder="Community Project, Meetup, Charity...">
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input id="location" type="text" placeholder="City / Country">
            </div>

            <div class="form-group">
                <label for="details">Details</label>
                <textarea id="details" rows="8" placeholder="Tell the community about your event or initiative..."></textarea>
            </div>

            <button class="btn btn-gold" type="submit">
                Publish Event
            </button>

        </form>

    </div>

</section>

</body>
</html>
